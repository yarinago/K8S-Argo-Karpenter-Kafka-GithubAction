crds:
  enabled: false
prometheusOperator:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
kubeStateMetrics:
  enabled: false
nodeExporter:
  enabled: false

kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: alb
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      external-dns.alpha.kubernetes.io/hostname: alertmanager-dev.splitwise.click
      argocd.argoproj.io/ignore-default-links: "true"
      link.argocd.argoproj.io/external-link: https://alertmanager-dev.splitwise.click
    hosts:
      - alertmanager-dev.splitwise.click
    paths:
      - /
    pathType: Prefix
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        # Watchdog is an always-firing heartbeat alert — sink it so the UI stays clean.
        - matchers:
            - alertname = "Watchdog"
          receiver: 'null'
        # EKS's control plane isn't scraped at all (see
        # prometheus-operator-values-dev.yaml) — these would be false
        # positives here for the same reason they are on k3d.
        - matchers:
            - alertname =~ "KubeControllerManagerDown|KubeProxyDown|KubeSchedulerDown"
          receiver: 'null'
    receivers:
      - name: 'null'
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal: ['alertname', 'namespace', 'pod']
