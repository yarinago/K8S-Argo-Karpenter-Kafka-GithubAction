# Same split as local: this Application installs only the kube-prometheus-
# stack CRDs and the operator. Prometheus/Alertmanager/Grafana are separate
# releases of the same chart (or, for Grafana, a different chart entirely)
# so each can be independently synced/rolled back.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: monitoring
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 80.13.3
      helm:
        releaseName: prometheus-operator
        valueFiles:
          - $values/Environment/aws/argocd/values/prometheus-operator-values-dev.yaml
    - repoURL: https://github.com/yarinago/K8S-Argo-Karpenter-Kafka-GithubAction.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: infrastructure
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: prometheus-operator-kube-p-admission
      namespace: infrastructure
      jsonPointers:
        - /data
