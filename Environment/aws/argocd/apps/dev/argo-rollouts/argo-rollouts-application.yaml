# Argo CD Application that installs the Argo Rollouts controller + dashboard
# — same chart/pattern as local's. Splitwise's producer/loadgen
# (splitwise/runtime/, via the shared Environment/resources/splitwise-runtime
# base) use Rollout resources for blue-green deployments; without this
# controller and its CRDs installed first, that whole Application fails to
# sync at all ("Rollout.argoproj.io not found") — hit live, including its
# knock-on effect of the Kafka cluster in that same Application never
# getting created either, since a kustomize sync failure blocks the whole
# Application's sync, not just the offending resource.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  # See monitoring/grafana-application.yaml's identical block for why
  # every child Application needs this, not just the app-of-apps root.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Early wave: Rollout custom resources (created by splitwise-runtime,
    # sync-wave unset/0 by default) need this controller's CRDs to exist
    # first.
    argocd.argoproj.io/sync-wave: "-1"
    # ServerSideApply=true below (sync option) only changes how the CRDs
    # are *applied* — it stopped using the size-limited
    # last-applied-configuration annotation, confirmed by managedFields
    # now showing a single "argocd-controller Apply" entry with no stale
    # client-side-apply manager. But Argo CD's *diff* still predicted the
    # merge client-side by default, missing fields the API server defaults
    # in on this schema, so the 5 CRDs here stayed OutOfSync even though
    # they were correctly applied (a documented ArgoCD gap — see
    # argoproj/argo-cd#11106, #11630). ServerSideDiff=true here makes the
    # API server compute the diff instead, which is what actually clears
    # the phantom drift.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-rollouts
      targetRevision: 2.37.7
      helm:
        releaseName: argo-rollouts
        valueFiles:
          - $values/Environment/aws/argocd/values/argo-rollouts-values-dev.yaml
    # This source only exists so the Helm values file above can be loaded via $values.
    - repoURL: https://github.com/yarinago/K8S-Argo-Karpenter-Kafka-GithubAction.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # rollouts.argoproj.io alone renders to ~586KB — well past kubectl
      # apply's 262144-byte cap on the last-applied-configuration annotation
      # client-side apply relies on for diffing. That annotation silently
      # gets truncated, so every diff sees drift that was never really
      # there and the Application sits permanently OutOfSync (Healthy the
      # whole time — nothing is actually broken). Server-side apply tracks
      # field ownership instead of that annotation, so it doesn't hit the
      # size limit. Confirmed live: all 5 CRDs here were the only resources
      # ever showing OutOfSync, and each carried a
      # last-applied-configuration annotation despite its exact-size mismatch.
      - ServerSideApply=true
