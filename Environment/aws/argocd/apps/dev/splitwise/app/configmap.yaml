# Deliberately empty. The app repo's Deployment (k8s/base/deployment.yaml,
# referenced unmodified below) hard-references this ConfigMap by name via
# envFrom, alongside splitwise-export-secrets — Kubernetes requires the
# object to exist for a non-optional configMapRef, even with zero keys.
# Every real value (both the config fields and the actual credentials)
# comes exclusively from Secrets Manager via the ExternalSecret in this
# same directory — the industry-standard path for a production AWS
# secrets setup, not SOPS-in-git. This placeholder exists purely to
# satisfy that reference, on purpose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: splitwise-export-config
data: {}
