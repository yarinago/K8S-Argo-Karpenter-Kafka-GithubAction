# Pulls every key (both the app's config values and its real credentials
# -- merged into one Secrets Manager entry by terraform-aws-envs.yaml's
# SOPS-decrypt-and-merge step) into a single Kubernetes Secret named to
# match what the app repo's Deployment already expects via envFrom, so
# this satisfies that reference without any change to the app repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: splitwise-export-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: splitwise-export-secrets
  dataFrom:
    - extract:
        key: splitwise/dev/app-config
