# AWS equivalent of local's kafka-ui-ingress.yaml (prod copy) — same
# backend service/port, ALB + external-dns annotations instead of
# Traefik + localtest.me.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-ui
  namespace: splitwise
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    external-dns.alpha.kubernetes.io/hostname: kafka-ui.splitwise.click
spec:
  rules:
    - host: kafka-ui.splitwise.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kafka-ui
                port:
                  number: 80
