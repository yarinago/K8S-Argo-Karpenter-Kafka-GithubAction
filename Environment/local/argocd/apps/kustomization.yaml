# Root Kustomize bundle for the local app-of-apps setup.
# The bootstrap Argo CD app points at this directory and creates these child apps.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Infrastructure apps (ingress, kafka operator, argo-cd bootstrap).
  - infrastructure
  # Monitoring project: Prometheus Operator, Prometheus, Alertmanager, Grafana, Loki.
  - monitoring
  # Groups Splitwise-specific Argo resources under one directory.
  - splitwise
