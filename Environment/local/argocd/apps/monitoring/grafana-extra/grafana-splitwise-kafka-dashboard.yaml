apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-splitwise-kafka
  labels:
    grafana_dashboard: "1"
data:
  splitwise-kafka-observability.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": null,
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "templating": {
        "list": [
          {
            "current": {
              "selected": true,
              "text": "splitwise-dev",
              "value": "splitwise-dev"
            },
            "hide": 0,
            "includeAll": false,
            "label": "Environment",
            "multi": false,
            "name": "namespace",
            "options": [
              {
                "selected": true,
                "text": "splitwise-dev",
                "value": "splitwise-dev"
              },
              {
                "selected": false,
                "text": "splitwise",
                "value": "splitwise"
              }
            ],
            "query": "splitwise-dev,splitwise",
            "type": "custom"
          },
          {
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "includeAll": true,
            "label": "Log Level",
            "multi": false,
            "name": "level",
            "options": [
              { "selected": true,  "text": "All",      "value": "$__all"    },
              { "selected": false, "text": "ERROR",     "value": "ERROR"     },
              { "selected": false, "text": "WARN",      "value": "WARN"      },
              { "selected": false, "text": "INFO",      "value": "INFO"      },
              { "selected": false, "text": "DEBUG",     "value": "DEBUG"     },
              { "selected": false, "text": "FATAL",     "value": "FATAL"     },
              { "selected": false, "text": "CRITICAL",  "value": "CRITICAL"  }
            ],
            "query": "ERROR,WARN,INFO,DEBUG,FATAL,CRITICAL",
            "type": "custom"
          }
        ]
      },
      "panels": [
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 3 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "kafka_brokers{namespace=\"$namespace\"}",
              "legendFormat": "Brokers",
              "refId": "A"
            }
          ],
          "title": "Kafka Brokers Online",
          "type": "stat"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "options": { "0": { "color": "green", "index": 0, "text": "0 OK" } }, "type": "value" }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(kafka_topic_partition_under_replicated_partition{namespace=\"$namespace\"})",
              "legendFormat": "URP",
              "refId": "A"
            }
          ],
          "title": "Under-Replicated Partitions",
          "type": "stat"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "max(kafka_consumergroup_members{namespace=\"$namespace\", consumergroup=\"splitwise-dashboard-materializer\"})",
              "legendFormat": "Members",
              "refId": "A"
            }
          ],
          "title": "Consumer Group Members",
          "type": "stat"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(kafka_topic_partition_current_offset{namespace=\"$namespace\", topic=\"splitwise.expenses.v1\"})",
              "legendFormat": "Total Offsets",
              "refId": "A"
            }
          ],
          "title": "Total Messages (splitwise.expenses.v1)",
          "type": "stat"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 16, "x": 0, "y": 4 },
          "id": 5,
          "options": {
            "legend": { "calcs": ["last", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(kafka_consumergroup_lag{namespace=\"$namespace\", consumergroup=\"splitwise-dashboard-materializer\"}) by (topic)",
              "legendFormat": "{{topic}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Consumer Lag By Topic",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 8, "x": 16, "y": 4 },
          "id": 6,
          "options": {
            "legend": { "calcs": ["last"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "kafka_consumergroup_lag{namespace=\"$namespace\", consumergroup=\"splitwise-dashboard-materializer\"}",
              "legendFormat": "partition {{partition}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Consumer Lag By Partition",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "mps",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 13 },
          "id": 7,
          "options": {
            "legend": { "calcs": ["mean", "last"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(kafka_topic_partition_current_offset{namespace=\"$namespace\", topic=\"splitwise.expenses.v1\"}[2m])) by (topic)",
              "legendFormat": "{{topic}} msg/s",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Messages Produced Per Second",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 13 },
          "id": 8,
          "options": {
            "legend": { "calcs": ["last", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "kafka_topic_partition_current_offset{namespace=\"$namespace\", topic=\"splitwise.expenses.v1\"}",
              "legendFormat": "partition {{partition}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Topic Partition Offsets",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 22 },
          "id": 9,
          "options": {
            "legend": { "calcs": ["last"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "kafka_topic_partition_in_sync_replica{namespace=\"$namespace\", topic=\"splitwise.expenses.v1\"}",
              "legendFormat": "partition {{partition}} ISR",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "In-Sync Replicas Per Partition",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 22 },
          "id": 10,
          "options": {
            "legend": { "calcs": ["last", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"$namespace\"}[1h])",
              "legendFormat": "{{pod}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Pod Restarts (last 1h)",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 31 },
          "id": 12,
          "options": {
            "legend": { "calcs": ["mean", "max", "last"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", container!=\"\", container!=\"POD\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "CPU Usage (cores)",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "bytes",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 31 },
          "id": 13,
          "options": {
            "legend": { "calcs": ["mean", "max", "last"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(container_memory_working_set_bytes{namespace=\"$namespace\", container!=\"\", container!=\"POD\"}) by (pod)",
              "legendFormat": "{{pod}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Memory Usage (working set)",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "reqps",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 8, "x": 0, "y": 40 },
          "id": 14,
          "options": {
            "legend": { "calcs": ["mean", "last"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(splitwise_http_requests_total{namespace=\"$namespace\", job=\"splitwise-export\"}[2m])) by (path)",
              "legendFormat": "{{path}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Web Requests Per Second (by route)",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "s",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 8, "x": 8, "y": 40 },
          "id": 15,
          "options": {
            "legend": { "calcs": ["mean", "max", "last"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum(rate(splitwise_http_request_duration_seconds_bucket{namespace=\"$namespace\", job=\"splitwise-export\"}[5m])) by (le, path))",
              "legendFormat": "{{path}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Web Request Latency p95 (by route)",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "percent",
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 8, "x": 16, "y": 40 },
          "id": 16,
          "options": {
            "legend": { "calcs": ["mean", "max", "last"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "100 * sum(rate(splitwise_http_requests_total{namespace=\"$namespace\", job=\"splitwise-export\", status=~\"5..\"}[5m])) / sum(rate(splitwise_http_requests_total{namespace=\"$namespace\", job=\"splitwise-export\"}[5m]))",
              "legendFormat": "5xx error rate",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Web Error Rate (%)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "loki-splitwise"
          },
          "gridPos": { "h": 14, "w": 24, "x": 0, "y": 49 },
          "id": 11,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki-splitwise"
              },
              "editorMode": "code",
              "expr": "{namespace=\"$namespace\", level=~\"$level\"}",
              "legendFormat": "",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Splitwise Logs",
          "type": "logs"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["splitwise", "kafka"],
      "time": { "from": "now-30m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Splitwise Kafka Observability",
      "uid": "splitwise-kafka-observability",
      "version": 8,
      "weekStart": ""
    }
