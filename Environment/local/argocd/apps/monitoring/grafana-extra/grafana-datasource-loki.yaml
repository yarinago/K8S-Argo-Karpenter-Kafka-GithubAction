# NOT currently applied — deliberately excluded from this directory's
# kustomization.yaml resources list. Kept as reference only. The actual
# Loki datasource is delivered via additionalDataSources directly in
# grafana-values.yaml, which renders the same config into Grafana's
# provisioning without needing a separately-watched ConfigMap. Wiring this
# one in too would just create a duplicate Loki datasource.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-loki
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki-splitwise
        url: http://loki:3100
        access: proxy
        isDefault: false
        jsonData:
          maxLines: 1000
