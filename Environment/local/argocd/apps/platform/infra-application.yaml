# Argo CD Application that deploys the local "infra" placeholder chart.
# This is separate from app workloads and is mainly a bootstrap/example app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra
  namespace: argocd
spec:
  project: local-platform
  sources:
    # The chart source: Argo renders the Helm chart stored in this repo.
    - repoURL: https://github.com/yarinago/K8S-Argo-Karpenter-Kafka-GithubAction.git
      targetRevision: feature/create-argocd
      path: Environment/local/argocd/charts/infra
      helm:
        valueFiles:
          # Values are loaded from the second source below through the $values ref.
          - $values/Environment/local/argocd/values/infra-values.yaml
    # This second source does not deploy resources by itself.
    # It only exposes this repo as "$values" so Argo can read the values file above.
    - repoURL: https://github.com/yarinago/K8S-Argo-Karpenter-Kafka-GithubAction.git
      targetRevision: feature/create-argocd
      ref: values
  destination:
    server: https://kubernetes.default.svc
    # Namespace created by sync option if it does not exist yet.
    namespace: infra-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Let Argo create the destination namespace automatically.
      - CreateNamespace=true
