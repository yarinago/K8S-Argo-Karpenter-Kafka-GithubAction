apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: splitwise-kafka-alerts
  labels:
    release: monitoring
spec:
  groups:
    - name: kafka.rules
      rules:
        - alert: KafkaConsumerLagHigh
          expr: sum by (consumergroup, topic) (kafka_consumergroup_lag) > 100
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Kafka consumer lag is high"
            description: >-
              Consumer group {{ $labels.consumergroup }} on topic {{ $labels.topic }}
              has a lag of {{ $value }} messages for more than 5 minutes.

        - alert: KafkaConsumerLagCritical
          expr: sum by (consumergroup, topic) (kafka_consumergroup_lag) > 1000
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kafka consumer lag is critically high"
            description: >-
              Consumer group {{ $labels.consumergroup }} on topic {{ $labels.topic }}
              has a lag of {{ $value }} messages — consumers may be stuck or down.

    - name: kubernetes.rules
      rules:
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace!="kube-system"}[15m]) > 3
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Pod is crash-looping"
            description: >-
              Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }}
              has restarted {{ $value | printf "%.0f" }} times in the last 15 minutes.

    - name: argocd.rules
      rules:
        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status!="Synced"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD application is out of sync"
            description: >-
              Application {{ $labels.name }} in project {{ $labels.project }}
              has been OutOfSync for more than 10 minutes.
              Sync status: {{ $labels.sync_status }}.
