# UNUSED — not referenced by kustomization.yaml. Left over from before the
# migration to Argo Rollouts (see producer-rollout.yaml, which replaced
# this). Kept only as a pre-migration reference; safe to delete.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: splitwise-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: splitwise-export
      app.kubernetes.io/component: producer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: splitwise-export
        app.kubernetes.io/part-of: splitwise-household-expenses
        app.kubernetes.io/component: producer
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: producer
          image: ghcr.io/yarinago/splitwise-household-expenses
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: APP_MODE
              value: producer
            - name: METRICS_PORT
              value: "9090"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: splitwise-kafka-kafka-bootstrap:9092
            - name: KAFKA_TOPIC
              value: splitwise.expenses.v1
            - name: SPLITWISE_LOAD_DOTENV
              value: "0"
          envFrom:
            - configMapRef:
                name: splitwise-export-config
            - secretRef:
                name: splitwise-export-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
