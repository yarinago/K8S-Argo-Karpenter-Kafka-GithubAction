apiVersion: v1
kind: Service
metadata:
  name: splitwise-producer-active
spec:
  selector:
    app.kubernetes.io/name: splitwise-export
    app.kubernetes.io/component: producer
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
