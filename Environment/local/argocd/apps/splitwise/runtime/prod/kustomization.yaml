apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: splitwise

resources:
  - ../base
  - kafka-ui-ingress.yaml

images:
  - name: ghcr.io/yarinago/splitwise-household-expenses
    newName: ghcr.io/yarinago/splitwise-household-expenses
    newTag: prod

patches:
  # Prod keeps more rollback depth than the base/dev default (3).
  - target:
      kind: Rollout
      name: splitwise-producer
    patch: |-
      - op: replace
        path: /spec/revisionHistoryLimit
        value: 10
  - target:
      kind: Rollout
      name: splitwise-loadgen
    patch: |-
      - op: replace
        path: /spec/revisionHistoryLimit
        value: 10
