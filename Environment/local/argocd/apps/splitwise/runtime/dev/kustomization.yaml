apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: splitwise-dev

resources:
  - ../base
  - kafka-ui-ingress.yaml

images:
  - name: ghcr.io/yarinago/splitwise-household-expenses
    newName: ghcr.io/yarinago/splitwise-household-expenses
    newTag: latest

patches:
  # Dev runs a single-broker Kafka to save local resources. Prod keeps 3
  # brokers (base default) since replication factor and ISR requirements
  # are the actual thing this project demonstrates for HA.
  - target:
      kind: KafkaNodePool
      name: pool-a
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Kafka
      name: splitwise-kafka
    patch: |-
      - op: replace
        path: /spec/kafka/config/default.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/min.insync.replicas
        value: 1
      - op: replace
        path: /spec/kafka/config/offsets.topic.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/transaction.state.log.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/transaction.state.log.min.isr
        value: 1
  - target:
      kind: KafkaTopic
      name: splitwise-expenses-v1
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/config/min.insync.replicas
        value: 1
