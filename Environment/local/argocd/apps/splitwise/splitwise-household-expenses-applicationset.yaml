# Generate one Argo CD Application per Splitwise environment.
# This avoids duplicating near-identical Application YAML files for dev/prod.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: splitwise-household-expenses
  namespace: argocd
spec:
  # Go-template rendering (Sprig), instead of the legacy fasttemplate engine.
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        # Each element becomes one generated Argo CD Application.
        elements:
          - name: splitwise-household-expenses-dev
            env: dev
            namespace: splitwise-dev
            # Path inside the Splitwise repo for this environment's manifests.
            path: k8s/overlays/dev
            # Dev follows the Kafka feature branch for testing.
            revision: feature/add-logs-to-splitwise-and-kafka
            url: http://splitwise-dev.localtest.me:8080
            # Argo CD Application-level sync/rollback history (status.history
            # entries), not the Rollout's own revisionHistoryLimit — dev is
            # disposable and fast-moving, so a shallow history is enough.
            revisionHistoryLimit: 3
          - name: splitwise-household-expenses
            env: prod
            namespace: splitwise
            path: k8s/overlays/prod
            # Prod follows the main branch.
            revision: main
            url: http://splitwise.localtest.me:8080
            # Deeper Application-level sync/rollback history than dev.
            revisionHistoryLimit: 10
  template:
    metadata:
      # Use the explicit per-environment application names from the generator.
      name: "{{.name}}"
      namespace: argocd
      labels:
        app.kubernetes.io/name: splitwise-household-expenses
        app.kubernetes.io/part-of: splitwise-household-expenses
        app.kubernetes.io/component: application
        # Helpful for filtering generated apps by environment in the Argo UI.
        app.kubernetes.io/instance: "{{.env}}"
      annotations:
        # Clickable application link shown in Argo CD.
        link.argocd.argoproj.io/app: "{{.url}}"
    spec:
      project: splitwise-household-expenses
      sources:
        # Source 1: Splitwise app repo — web Deployment, Service, ConfigMap, Ingress.
        - repoURL: https://github.com/yarinago/splitwise-household-expenses.git
          targetRevision: "{{.revision}}"
          path: "{{.path}}"
        # Source 2: GitOps repo runtime overlay — Kafka cluster, topic, producer Deployment,
        # and the merged web+consumer Deployment (overwrites Source 1's web-only Deployment).
        - repoURL: https://github.com/yarinago/K8S-Argo-Karpenter-Kafka-GithubAction.git
          targetRevision: feature/use-rollout-and-blue-green
          path: "Environment/local/argocd/apps/splitwise/runtime/{{.env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
  # revisionHistoryLimit (Application-level sync/rollback history, NOT the
  # Rollout's own revisionHistoryLimit for old ReplicaSets) can't live in
  # `template.spec` above: the ApplicationSet CRD types that field as a real
  # integer, so a quoted template string fails schema validation on apply
  # ("must be of type integer"), while an unquoted "{{.x}}" isn't valid YAML
  # either (leading `{{` parses as a flow-mapping open). templatePatch is a
  # plain string field, so the placeholder only becomes a real int when the
  # controller renders and merges this patch onto the already-built
  # Application object, after both YAML parsing and schema validation.
  templatePatch: |
    spec:
      revisionHistoryLimit: {{.revisionHistoryLimit}}
