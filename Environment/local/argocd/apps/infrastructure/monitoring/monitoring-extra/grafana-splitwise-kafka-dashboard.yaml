              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(kafka_topic_partition_current_offset{topic=\"splitwise.expenses.v1\"})",
              "legendFormat": "Total Offsets",
              "refId": "A"
            }
          ],
          "title": "Total Messages (splitwise.expenses.v1)",
          "type": "stat"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 16, "x": 0, "y": 4 },
          "id": 5,
          "options": {
            "legend": { "calcs": ["last", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(kafka_consumergroup_lag{consumergroup=\"splitwise-dashboard-materializer\"}) by (topic)",
              "legendFormat": "{{topic}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Consumer Lag By Topic",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 8, "x": 16, "y": 4 },
          "id": 6,
          "options": {
            "legend": { "calcs": ["last"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "kafka_consumergroup_lag{consumergroup=\"splitwise-dashboard-materializer\"}",
              "legendFormat": "partition {{partition}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Consumer Lag By Partition",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "unit": "mps",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 13 },
          "id": 7,
          "options": {
            "legend": { "calcs": ["mean", "last"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(kafka_topic_partition_current_offset{topic=\"splitwise.expenses.v1\"}[2m])) by (topic)",
              "legendFormat": "{{topic}} msg/s",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Messages Produced Per Second",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 13 },
          "id": 8,
          "options": {
            "legend": { "calcs": ["last", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "kafka_topic_partition_current_offset{topic=\"splitwise.expenses.v1\"}",
              "legendFormat": "partition {{partition}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Topic Partition Offsets",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 22 },
          "id": 9,
          "options": {
            "legend": { "calcs": ["last"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "kafka_topic_partition_in_sync_replica{topic=\"splitwise.expenses.v1\"}",
              "legendFormat": "partition {{partition}} ISR",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "In-Sync Replicas Per Partition",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 22 },
          "id": 10,
          "options": {
            "legend": { "calcs": ["last", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "increase(kube_pod_container_status_restarts_total{namespace=~\"splitwise.*\"}[1h])",
              "legendFormat": "{{namespace}}/{{pod}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Pod Restarts (splitwise namespaces, last 1h)",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["splitwise", "kafka"],
      "templating": { "list": [] },
      "time": { "from": "now-30m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Splitwise Kafka Observability",
      "uid": "splitwise-kafka-observability",
      "version": 2,
      "weekStart": ""
