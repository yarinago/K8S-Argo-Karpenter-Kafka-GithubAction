# Argo CD Application that installs Prometheus and Grafana for local observability.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: argocd-bootstrap
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 80.13.3
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/Environment/local/argocd/values/monitoring-values.yaml
    - repoURL: https://github.com/yarinago/K8S-Argo-Karpenter-Kafka-GithubAction.git
      targetRevision: feature/use-rollout-and-blue-green
      ref: values
    - repoURL: https://github.com/yarinago/K8S-Argo-Karpenter-Kafka-GithubAction.git
      targetRevision: feature/use-rollout-and-blue-green
      path: Environment/local/argocd/apps/infrastructure/monitoring/monitoring-extra
  destination:
    server: https://kubernetes.default.svc
    namespace: infrastructure
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Stops Argo CD from writing ignored fields (e.g. checksum/secret) during
      # sync, which would otherwise trigger a Deployment rollout every cycle.
      - RespectIgnoreDifferences=true
  # Grafana and Prometheus generate secrets at install time (admin password,
  # webhook certs). Their contents are never in Git so Argo CD always sees a
  # diff. Ignore the data fields to stop the permanent OutOfSync noise.
  # The Grafana Deployment carries a checksum/secret annotation that mirrors
  # the secret hash — it drifts whenever the secret data differs, so ignore it too.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: monitoring-grafana
      namespace: infrastructure
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: monitoring-kube-prometheus-st-admission
      namespace: infrastructure
      jsonPointers:
        - /data
    - group: apps
      kind: Deployment
      name: monitoring-grafana
      namespace: infrastructure
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
