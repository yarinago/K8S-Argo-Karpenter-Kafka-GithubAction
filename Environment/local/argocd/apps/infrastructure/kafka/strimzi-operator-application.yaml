# Argo CD Application that installs the Strimzi Cluster Operator.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-strimzi
  namespace: argocd
  annotations:
    # Early wave: Kafka/KafkaTopic/etc. custom resources (created by
    # Splitwise's runtime overlay) need this operator's CRDs to exist first.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: argocd-bootstrap
  sources:
    - repoURL: https://strimzi.io/charts/
      chart: strimzi-kafka-operator
      targetRevision: 0.51.0
      helm:
        releaseName: strimzi
        valueFiles:
          - $values/Environment/local/argocd/values/strimzi-values.yaml
    # This source only exists so the Helm values file above can be loaded via $values.
    - repoURL: https://github.com/yarinago/K8S-Argo-Karpenter-Kafka-GithubAction.git
      targetRevision: feature/use-rollout-and-blue-green
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: infrastructure
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
