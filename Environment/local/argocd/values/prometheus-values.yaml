# CRDs and the operator come from the prometheus-operator Application; do not
# reinstall them here to avoid two releases fighting over the same resources.
crds:
  enabled: false
prometheusOperator:
  enabled: false
alertmanager:
  enabled: false
grafana:
  enabled: false

kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true

prometheus:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      argocd.argoproj.io/ignore-default-links: "true"
      link.argocd.argoproj.io/external-link: http://prometheus.localtest.me:8080
    hosts:
      - prometheus.localtest.me
    paths:
      - /
    pathType: Prefix
  prometheusSpec:
    retention: 2d
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    # Select PrometheusRules across all namespaces regardless of release
    # label, same as the pod/service monitor selectors above.
    ruleSelector: {}
    ruleNamespaceSelector: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
