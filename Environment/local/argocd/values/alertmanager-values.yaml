# CRDs and the operator come from the prometheus-operator Application; do not
# reinstall them here to avoid two releases fighting over the same resources.
crds:
  enabled: false
prometheusOperator:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
kubeStateMetrics:
  enabled: false
nodeExporter:
  enabled: false

# k3d does not expose these control-plane components as scrape targets, and
# the chart would otherwise create Service/ServiceMonitor proxies for them in
# kube-system, which the monitoring AppProject doesn't permit.
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      argocd.argoproj.io/ignore-default-links: "true"
      link.argocd.argoproj.io/external-link: http://alertmanager.localtest.me:8080
    hosts:
      - alertmanager.localtest.me
    paths:
      - /
    pathType: Prefix
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        # Watchdog is a always-firing heartbeat alert — sink it so the UI stays clean.
        - matchers:
            - alertname = "Watchdog"
          receiver: 'null'
        # k3s does not expose kube-controller-manager, kube-proxy, or kube-scheduler
        # as scrape targets — these alerts are false positives on k3d.
        - matchers:
            - alertname =~ "KubeControllerManagerDown|KubeProxyDown|KubeSchedulerDown"
          receiver: 'null'
    receivers:
      - name: 'null'
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal: ['alertname', 'namespace', 'pod']
