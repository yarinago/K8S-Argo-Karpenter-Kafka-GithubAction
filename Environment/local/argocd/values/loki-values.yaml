loki:
  enabled: true
  persistence:
    enabled: false
  config:
    compactor:
      working_directory: /data/loki/boltdb-shipper-compactor
      shared_store: filesystem
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
    limits_config:
      retention_period: 720h   # 30 days — default (prod)
      retention_stream:
        - selector: '{namespace="splitwise-dev"}'
          priority: 1
          period: 168h          # 7 days for dev
    chunk_store_config:
      max_look_back_period: 720h
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

promtail:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  config:
    snippets:
      extraRelabelConfigs:
        - action: keep
          source_labels: [__meta_kubernetes_namespace]
          regex: "splitwise.*|infrastructure|argocd"
      pipelineStages:
        - cri: {}
        - regex:
            expression: '(?:^|\s)(?P<level>TRACE|DEBUG|INFO|WARN|ERROR|FATAL|CRITICAL)(?:\s|\[|$)'
        - labels:
            level:

# We already have Grafana from kube-prometheus-stack.
# Disable the auto-generated datasource ConfigMap — it sets isDefault: true
# which conflicts with Prometheus. Loki is added via additionalDataSources
# in monitoring-values.yaml instead.
grafana:
  enabled: false
  sidecar:
    datasources:
      enabled: false
