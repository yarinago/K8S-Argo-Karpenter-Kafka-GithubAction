loki:
  enabled: true
  persistence:
    enabled: false
  config:
    compactor:
      working_directory: /data/loki/boltdb-shipper-compactor
      shared_store: filesystem
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
    limits_config:
      retention_period: 720h   # 30 days — default (prod)
      retention_stream:
        - selector: '{namespace="splitwise-dev"}'
          priority: 1
          period: 168h          # 7 days for dev
    chunk_store_config:
      max_look_back_period: 720h
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

promtail:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  # Filter to only collect logs from relevant namespaces — appended to the
  # default scrape config so the log file paths remain correctly configured.
  config:
    snippets:
      extraRelabelConfigs:
        - action: keep
          source_labels: [__meta_kubernetes_namespace]
          regex: "splitwise.*|infrastructure|argocd"

# We already have Grafana from kube-prometheus-stack.
grafana:
  enabled: false
