alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      argocd.argoproj.io/ignore-default-links: "true"
      link.argocd.argoproj.io/external-link: http://alertmanager.localtest.me:8080
    hosts:
      - alertmanager.localtest.me
    paths:
      - /
    pathType: Prefix
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        # Watchdog is a always-firing heartbeat alert — sink it so the UI stays clean.
        - matchers:
            - alertname = "Watchdog"
          receiver: 'null'
        # k3s does not expose kube-controller-manager, kube-proxy, or kube-scheduler
        # as scrape targets — these alerts are false positives on k3d.
        - matchers:
            - alertname =~ "KubeControllerManagerDown|KubeProxyDown|KubeSchedulerDown"
          receiver: 'null'
    receivers:
      - name: 'null'
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal: ['alertname', 'namespace', 'pod']

grafana:
  defaultDashboardsEnabled: false
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
      argocd.argoproj.io/ignore-default-links: "true"
      link.argocd.argoproj.io/external-link: http://grafana.localtest.me:8080
    hosts:
      - grafana.localtest.me
    path: /
    pathType: Prefix
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
    auth:
      disable_login_form: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL

prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      argocd.argoproj.io/ignore-default-links: "true"
      link.argocd.argoproj.io/external-link: http://prometheus.localtest.me:8080
    hosts:
      - prometheus.localtest.me
    paths:
      - /
    pathType: Prefix
  prometheusSpec:
    retention: 2d
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
