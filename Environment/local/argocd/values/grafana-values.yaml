# CRDs and the operator come from the prometheus-operator Application; do not
# reinstall them here to avoid two releases fighting over the same resources.
# Grafana itself has no dependency on the operator or its CRDs.
crds:
  enabled: false
prometheusOperator:
  enabled: false
prometheus:
  enabled: false
alertmanager:
  enabled: false
kubeStateMetrics:
  enabled: false
nodeExporter:
  enabled: false

# k3d does not expose these control-plane components as scrape targets, and
# the chart would otherwise create Service/ServiceMonitor proxies for them in
# kube-system, which the monitoring AppProject doesn't permit.
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false

grafana:
  enabled: true
  defaultDashboardsEnabled: false
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
      argocd.argoproj.io/ignore-default-links: "true"
      link.argocd.argoproj.io/external-link: http://grafana.localtest.me:8080
    hosts:
      - grafana.localtest.me
    path: /
    pathType: Prefix
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
    auth:
      disable_login_form: true
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki-splitwise
      url: http://loki:3100
      access: proxy
      isDefault: false
      jsonData:
        maxLines: 1000
    # The chart always auto-generates "Prometheus"/"Alertmanager" datasources
    # (uid: prometheus / alertmanager) pointing at {release}-kube-prometheus-st-*,
    # assuming Prometheus/Alertmanager are installed by this same release. Since
    # they're separate releases here, override those two by uid with the real
    # service hostnames — Grafana's file provisioning applies entries in order,
    # so a later entry with the same uid replaces the earlier one.
    - name: Prometheus
      type: prometheus
      uid: prometheus
      url: http://prometheus-kube-prometheus-prometheus.infrastructure:9090/
      access: proxy
      isDefault: true
      jsonData:
        httpMethod: POST
        timeInterval: 30s
    - name: Alertmanager
      type: alertmanager
      uid: alertmanager
      url: http://alertmanager-kube-promethe-alertmanager.infrastructure:9093/
      access: proxy
      jsonData:
        handleGrafanaManagedAlerts: false
        implementation: prometheus
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL
